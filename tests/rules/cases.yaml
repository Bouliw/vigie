    - fixture: winjson/empire_persistence_registry_modification_run_keys_standard_user_certutil_excerpt.json  # weak: cmd.exe and certutil
    - fixture: evtx/sysmon_11_1_lolbas_downldr_desktopimgdownldr.evtx  # weak: a download through another binary

- rule: 6d38971e-684e-455c-a1f9-6792990be772  # File Download Via Desktopimgdownldr
  positive:
    - {fixture: evtx/sysmon_11_1_lolbas_downldr_desktopimgdownldr.evtx, expected: 1}  # the only public desktopimgdownldr run
  negative:
    - fixture: evtx/panache_sysmon_vs_EDRTestingScript.evtx  # weak: certutil and bitsadmin downloads
    - fixture: evtx/PanacheSysmon_vs_AtomicRedTeam01.evtx  # weak: an Atomic Red Team run without desktopimgdownldr
    - fixture: evtx/sysmon_1_persist_bitsjob_SetNotifyCmdLine.evtx  # weak: an https URL in a regsvr32 command line
    - fixture: winjson/empire_persistence_registry_modification_run_keys_standard_user_certutil_excerpt.json  # weak: benign certutil
    - fixture: winjson/cmd_bitsadmin_download_psh_script_excerpt.json  # weak: a bitsadmin download
