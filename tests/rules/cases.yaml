  positive:
    - {fixture: winjson/cmd_bitsadmin_download_psh_script_excerpt.json, expected: 2}  # /transfer, in Sysmon 1 and 4688
    - {fixture: evtx/panache_sysmon_vs_EDRTestingScript.evtx, expected: 1}  # /transfer
    # /transfer and /addfile with a URL; not its /create, /setnotifycmdline, /complete and /resume runs.
