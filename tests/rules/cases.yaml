# Download LOLBins (process creation)

- rule: d44cf25a-9d55-4b94-a59f-d4ca3362fac3  # File Download Via Certutil
  positive:
    - {fixture: evtx/panache_sysmon_vs_EDRTestingScript.evtx, expected: 1}  # the only public certutil download
  negative:
