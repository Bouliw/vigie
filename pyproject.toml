[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vigie"
version = "0.4.2"
description = "Blue team log analyzer: read Windows EVTX, Linux auth.log, the macOS unified log and AI agent logs, apply Sigma rules, map alerts to MITRE ATT&CK, ATLAS and the OWASP Top 10 for LLM and agentic applications, and report, after the fact or live."
readme = "README.md"
license = { text = "MIT; rules adapted from SigmaHQ: DRL-1.1; ATT&CK data: MITRE ATT&CK Terms of Use; ATLAS data: Apache-2.0; OWASP Top 10 names: CC-BY-SA-4.0" }
authors = [{ name = "Bouliw" }]
requires-python = ">=3.10"
dependencies = [
    "evtx>=0.13,<1",
    "Jinja2>=3.1",
    "PyYAML>=6",
    "tzdata; sys_platform == 'win32'",
]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
vigie = "vigie.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vigie.atlas" = ["data/*.json", "data/*.txt", "data/*.md"]
"vigie.attack" = ["data/*.json", "data/*.txt", "data/*.md"]
"vigie.demo" = ["README.md", "logs/*"]
"vigie.icons" = ["*.svg", "*.png", "*.ico", "*.icns"]
"vigie.ui" = ["templates/*.j2"]
"vigie.report" = ["templates/*.j2"]
"vigie.rules" = ["*.md", "ai/*.yml", "linux/*.yml", "macos/*.yml", "windows/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
