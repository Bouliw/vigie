[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vigie"
version = "0.2.0"
description = "Blue team log analyzer: read Windows EVTX, Linux auth.log and the macOS unified log, apply Sigma rules, map alerts to MITRE ATT&CK, and report, after the fact or live."
readme = "README.md"
license = { text = "MIT; rules adapted from SigmaHQ: DRL-1.1; ATT&CK data: MITRE ATT&CK Terms of Use" }
authors = [{ name = "Bouliw" }]
requires-python = ">=3.10"
dependencies = [
    "evtx>=0.13,<1",
    "Jinja2>=3.1",
    "PyYAML>=6",
]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
vigie = "vigie.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vigie.attack" = ["data/*.json", "data/*.txt", "data/*.md"]
"vigie.report" = ["templates/*.j2"]
"vigie.rules" = ["*.md", "linux/*.yml", "macos/*.yml", "windows/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
