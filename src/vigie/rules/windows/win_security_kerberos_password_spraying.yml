title: Kerberos Password Spraying From Single Source
id: bf0ebcbf-b7ab-4600-8558-54ec2de7b272
status: test
description: Kerberos authentication failures (wrong password or unknown user name) for at least 5 different accounts from the same IP address within 10 minutes, logged by a domain controller. Password spraying tools such as Kerbrute try one password against many accounts to stay under the lockout threshold, and talk to the domain controller directly, so no 4625 event is logged anywhere.
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4771
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4768
    - https://attack.mitre.org/techniques/T1110/003/
author: Bouliw
date: 2026-09-28
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - win_kerberos_auth_failure
    group-by:
        - IpAddress
    timespan: 10m
    condition:
        gte: 5
        field: TargetUserName
falsepositives:
    - A server that authenticates users on their behalf (Exchange, AD FS, VPN or Citrix gateway) when several users mistype their password within minutes
    - A script or application still looping over accounts that were deleted or renamed
level: medium
