title: PsExec-Like Service Installed
id: 4d9d8b96-f9b9-4454-86d2-5dc723e625bb
related:
    - id: 42c575ea-e41e-41f1-b248-8093c3e82a28
      type: derived
    - id: de7ce410-b3fb-4e8a-b38c-3b999e2c3420
