title: SSH Failed Password
id: 73004885-6e82-4146-ab6a-1b834d099ee5
name: ssh_failed_password
status: test
description: An SSH client failed password authentication. On its own this is routine noise; it feeds the SSH brute force and password spraying correlations.
references:
    - https://attack.mitre.org/techniques/T1110/
author: Bouliw
date: 2026-09-28
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: linux
    service: sshd
detection:
    selection:
        action: ssh_failed_password
        # Failed publickey lines are key probes by clients holding several keys,
        # not password guesses.
        auth_method:
            - password
            - keyboard-interactive/pam
    condition: selection
falsepositives:
    - Users mistyping their password
level: low
