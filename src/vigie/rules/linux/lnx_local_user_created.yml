description: A local user account was created with useradd. Attackers create accounts to keep access to a compromised host.
references:
    - https://attack.mitre.org/techniques/T1136/001/
author: Bouliw
date: 2026-09-28
tags:
    - attack.persistence
    - attack.t1136.001
logsource:
