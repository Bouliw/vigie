title: SSH Password Spraying
id: a5668195-278b-4b24-aaf9-53ee8ff41701
status: test
description: Failed SSH password attempts against at least 5 different user names from the same source address within 10 minutes. Trying many accounts with a few common passwords avoids per-account lockouts.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: Bouliw
date: 2026-09-28
tags:
    - attack.credential-access
    - attack.t1110.003
correlation:
    type: value_count
    rules:
        - ssh_failed_password
    group-by:
        - src_ip
    timespan: 10m
    condition:
        gte: 5
        field: user
falsepositives:
    - A shared jump host where several users mistype their passwords in a short time
level: medium
