title: Secret Or Credential In LLM Response
id: b832c4f2-08c3-4c4d-81d0-22ced1fc139c
status: experimental
description: A model response contains a credential in a format that can be recognized without guessing - an AWS access key id, a GitHub or GitLab token, a Slack token, a Stripe live key, a Google API key, an "sk-" secret key of an LLM API, or a private key block with its content. The model took it from its context (system prompt, retrieved document, tool result, another user's data) and handed it to whoever is reading. Revoke the credential, then find where the model got it. Documentation examples (AKIAIOSFODNN7EXAMPLE) and placeholders (sk-xxxx...) are left out.
references:
    - https://atlas.mitre.org/techniques/AML.T0055
    - https://atlas.mitre.org/techniques/AML.T0136
    - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
author: Bouliw
date: 2026-10-29
tags:
    - atlas.credential-access
    - atlas.exfiltration
    - atlas.aml.t0055
    - atlas.aml.t0136
    - owasp.llm02
logsource:
    product: ai
    service: agentlog
detection:
    selection:
        type: response
        content|re:
            - '\b(?:AKIA|ASIA)(?!IOSFODNN7EXAMPLE)[A-Z0-9]{16}\b'
            - '\bgh[pousr]_[A-Za-z0-9]{36}\b|\bgithub_pat_[A-Za-z0-9_]{80,}'
            - '\bglpat-[A-Za-z0-9_-]{20}\b'
            - '\bxox[abposr]-[0-9]{6,}-[A-Za-z0-9-]{10,}'
            - '\b[rs]k_live_[A-Za-z0-9]{24,}'
            - '\bAIza[0-9A-Za-z_-]{35}(?![0-9A-Za-z_-])'
            # Not placeholders: sk-xxxxxxxx..., sk-your-api-key-here...
            - '\bsk-(?:proj-)?(?![xX*.]{6})(?!(?i:your|my|test|example|dummy|fake|placeholder|insert|replace))[A-Za-z0-9][A-Za-z0-9_-]{31,}'
            - '-----BEGIN (?:RSA |DSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----\s*[A-Za-z0-9+/=]{40}'
    condition: selection
falsepositives:
    - A user asking the model to reformat a key they pasted themselves
    - Revoked keys published in security advisories
level: high
