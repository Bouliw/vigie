title: AI Agent Tool Call Reads Credential Files
id: 83fb871f-b4e4-4ec7-847e-8713cf30c41c
status: experimental
description: An AI agent asked a tool (file read, shell, HTTP request) to access a place where credentials are stored - SSH private keys (not the .pub public keys), cloud credentials (AWS, Google Cloud, Azure), Kubernetes and Docker configurations, .netrc, .git-credentials, .pgpass, .pypirc, /etc/shadow, the pass store, GnuPG private keys, browser password databases, the macOS keychain - or the cloud instance metadata service, which hands out the instance's credentials. A task rarely needs them; prompt injections and poisoned tools ask for them to steal them. .env files are left out on purpose, because coding agents read them for configuration.
references:
    - https://atlas.mitre.org/techniques/AML.T0055
    - https://atlas.mitre.org/techniques/AML.T0098
    - https://invariantlabs.ai/blog/mcp-security-notification-tool-poisoning-attacks
author: Bouliw
date: 2026-10-29
tags:
    - atlas.credential-access
    - atlas.aml.t0055
    - atlas.aml.t0098
    - owasp.asi03
logsource:
    product: ai
    service: agentlog
detection:
    selection:
        type: tool_call
        arguments|re:
            - '(?i)\.ssh[/\\]+id_(?:rsa|dsa|ecdsa|ed25519)(?:_sk)?(?!\.pub)\b'
            - '(?i)\.aws[/\\]+credentials\b|\.config[/\\]+gcloud[/\\]|application_default_credentials\.json|\.azure[/\\]+(?:accessTokens\.json|msal_token_cache)'
            - '(?i)\.kube[/\\]+config\b|\.docker[/\\]+config\.json|(?:^|[/\\"\s])\.(?:netrc|git-credentials|pgpass|pypirc)\b'
            - '(?i)/etc/(?:g?shadow|master\.passwd)\b|\.password-store[/\\]|\.gnupg[/\\]+private-keys'
            - '(?i)Login Data\b|\blogins\.json\b|\bkey4\.db\b|/Library/Keychains/|\bsecurity\s+(?:find-generic-password|find-internet-password|dump-keychain)\b'
            # Cloud instance metadata services, reached through a fetch tool (SSRF).
            - '169\.254\.169\.254|metadata\.google\.internal'
    condition: selection
falsepositives:
    - A user asking the agent to help configure SSH, a cloud CLI or Kubernetes on their own machine
level: high
