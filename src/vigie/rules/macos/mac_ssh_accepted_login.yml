title: macOS SSH Login Accepted
id: be0fb8f5-7dcb-40c1-b1a4-987f053e9409
name: mac_ssh_accepted_login
status: test
description: A successful SSH login on a Mac. Informational context for the analyst, and the second step of the macOS login-after-brute-force correlation.
references:
    - https://attack.mitre.org/techniques/T1021/004/
author: Bouliw
date: 2026-10-12
tags:
    - attack.lateral-movement
    - attack.t1021.004
logsource:
    product: macos
    service: unifiedlog
detection:
    selection:
        process:
            - sshd
            - sshd-session
            - sshd-auth
        action: ssh_accepted
    condition: selection
falsepositives:
    - Every legitimate SSH login
level: informational
