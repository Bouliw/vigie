title: macOS XProtect Behavioral Detection Of Data Theft
id: 3261686f-7d29-4f7b-83a5-c93b34408c61
status: test
description: A behavioral rule of XProtect caught a program other than an Apple system binary reading what info stealers go after, such as browser data, the keychains, Messages or password extensions. The decoded XProtect signature name is in the signature field.
references:
    - https://attack.mitre.org/techniques/T1555/001/
    - https://attack.mitre.org/techniques/T1555/003/
    - https://support.apple.com/guide/security/protecting-against-malware-sec469d47bd8/web
author: Bouliw
date: 2026-10-12
tags:
    - attack.credential-access
    - attack.collection
    - attack.t1555.001
    - attack.t1555.003
    - attack.t1539
    - attack.t1005
logsource:
    product: macos
    service: unifiedlog
detection:
    selection:
        process: syspolicyd
        action: xprotect_behavior
        signature:
            - macOS.Browser.Generic
            - macOS.Messages.Generic
            - macOS.QntDb.Generic
            - macOS.InfoStealer.Generic
            - macOS.PasswordExtension.Exec
            - macOS.AppleEvents.Browsers
            - macOS.AppleEvents.LocalData
            - macOS.DataExfil.Keychain
            # macOS.DataExfil.Clipboard is left out: on an ordinary Mac it fired
            # for a regular app within minutes of starting vigie watch.
    condition: selection
falsepositives:
    - Password managers, backup and migration tools reading browser data or keychains
level: high
