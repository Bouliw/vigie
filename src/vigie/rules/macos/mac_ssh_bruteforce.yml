title: macOS SSH Brute Force
id: 32d4dc18-6307-4ad1-b937-aa19566eaf42
name: mac_ssh_bruteforce
status: test
description: At least 10 failed SSH password attempts on a Mac from the same source address within 5 minutes, the signature of an automated password guessing attack against Remote Login.
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: Bouliw
date: 2026-10-12
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - mac_ssh_failed_password
    group-by:
        - src_ip
    timespan: 5m
    condition:
        gte: 10
falsepositives:
    - A script or tool retrying an outdated password
    - Vulnerability scanners run by the security team
level: medium
