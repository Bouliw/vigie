title: macOS Repeated Local Password Failures
id: a9f5e58e-3322-4af8-adbe-68150a29350f
status: test
description: At least 5 wrong passwords for the same local account within 5 minutes. Someone may be guessing the password of the Mac, at the screen lock, with sudo or su, or through a password prompt. macOS hides the user name, so the account is identified by its UUID (dscl . -search /Users GeneratedUID <uuid>).
references:
    - https://attack.mitre.org/techniques/T1110/001/
author: Bouliw
date: 2026-10-12
tags:
    - attack.credential-access
    - attack.t1110.001
correlation:
    type: event_count
    rules:
        - mac_local_auth_failure
    group-by:
        - account_uuid
    timespan: 5m
    condition:
        gte: 5
falsepositives:
    - A user who forgot their password, or keeps the wrong keyboard layout
    - An Apple service retrying a stale password, such as akd (Apple Account) after a password change
level: medium
