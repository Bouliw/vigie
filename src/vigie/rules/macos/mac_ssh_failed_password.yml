title: macOS SSH Failed Password
id: e9ae903d-6632-4e89-beea-4da9d26a99af
name: mac_ssh_failed_password
status: test
description: An SSH client failed password authentication on a Mac with Remote Login turned on. On its own this is routine noise; it feeds the macOS SSH brute force correlation.
references:
    - https://attack.mitre.org/techniques/T1110/
author: Bouliw
date: 2026-10-12
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    product: macos
    service: unifiedlog
detection:
    selection:
        # OpenSSH 9.8+ writes per-connection messages as sshd-session, 10.0+ also as sshd-auth.
        process:
            - sshd
            - sshd-session
            - sshd-auth
        action: ssh_failed_password
        # Failed publickey lines are key probes by clients holding several keys,
        # not password guesses.
        auth_method:
            - password
            - keyboard-interactive/pam
    condition: selection
falsepositives:
    - Users mistyping their password
level: low
